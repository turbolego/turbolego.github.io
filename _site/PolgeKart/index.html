<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PlogeKart – Snowplow Tracker</title>
<meta name="theme-color" content="#0b1220" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" sizes="any">
<meta http-equiv="Permissions-Policy" content="accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking="/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
<header>
<h1>PlogeKart</h1>
<div class="controls">
<select id="groupSelect"><option value="">Loading groups…</option></select>
<button id="enableNotif">Enable notifications</button>
<button id="clearArea">Clear area</button>
<button id="settingsBtn">Settings</button>
</div>
</header>
<main>
<div id="map"></div>
<p id="status">Ready</p>
<pre id="log"></pre>
</main>
</div>
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h2>Settings</h2>
    <form id="settingsForm">
      <label>
        Check interval:
        <select id="intervalType">
          <option value="daily">Daily</option>
          <option value="multiple">Every day multiple times a day</option>
        </select>
      </label>
      <div id="dailySettings" style="display:block">
        <label>
          Days of week:
          <select id="daysOfWeek" multiple size="7">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </label>
        <label>
          Time of day:
          <input type="time" id="dailyTime">
        </label>
        <button type="button" id="addDailyTime">Add time</button>
        <button type="button" id="clearTimes" style="margin-left:0.5rem;">Clear all times</button>
        <div id="dailyTimes"></div>
      </div>
      <div id="multipleSettings" style="display:none">
        <label>
          Check every:
          <select id="multipleInterval">
            <option value="10">10 minutes</option>
            <option value="30">30 minutes</option>
            <option value="60">60 minutes</option>
          </select>
        </label>
        <label>
          Active between:
          <input type="time" id="startTime">
          and
          <input type="time" id="endTime">
        </label>
      </div>
      <button type="submit">Save settings</button>
    </form>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="js/app.js"></script>
</body>
</html>
