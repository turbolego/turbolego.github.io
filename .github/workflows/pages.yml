name: Deploy Eleventy

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Remove Eleventy's nested PlogeKart copy (it copies ./src/PlogeKart into _site)
      - name: Clean Eleventy's PlogeKart output
        run: rm -rf _site/PlogeKart

      # Sync the clean committed src/PlogeKart into _site
      - name: Sync clean PlogeKart into _site
        run: |
          cp -r src/PlogeKart _site/PlogeKart
          cp src/PlogeKart/data/static-roads.geojson _site/PlogeKart/data/static-roads.geojson
          cp src/PlogeKart/icons/icon-192.png _site/PlogeKart/icons/icon-192.png
          cp src/PlogeKart/icons/icon-512.png _site/PlogeKart/icons/icon-512.png

      - name: Deploy clean _site to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5